name: Verify VoxGuard
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            ml/requirements.txt
      - name: Install FFmpeg and CPU dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r backend/requirements.txt -r ml/requirements.txt pytest httpx
          python -m pip check
      - name: Restore immutable model checkpoint
        uses: actions/cache@v4
        with:
          path: ml/checkpoints/AASIST.pth
          key: aasist-${{ hashFiles('ml/constants.py') }}
      - name: Verify authentic model weights
        run: python -m ml.download_model
      - name: Test API, real inference and research tools
        run: python -m pytest tests research ml -q
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --run
      - run: npm run build
